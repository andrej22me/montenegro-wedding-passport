<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The weekend, interactive map</title>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Schibsted+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F0E8}
a{color:#16282B;text-underline-offset:3px}a:hover{color:#A3471F}
.pin{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.pin .dot{width:24px;height:24px;border-radius:50%;background:#16282B;color:#F3F0E8;font:600 12px/24px 'Schibsted Grotesk',Arial,sans-serif;text-align:center;box-shadow:0 0 0 2px #F3F0E8;transition:transform .35s ease,background .35s ease,opacity .35s ease}
.pin.dim .dot{opacity:.5}
.pin.on{z-index:3}
.pin.on .dot{background:#A3471F;transform:scale(1.3)}
.pin.on::before{content:'';position:absolute;width:24px;height:24px;border-radius:50%;border:2px solid #A3471F;animation:ring 1.8s ease-out infinite}
.pin .tag{display:none;position:absolute;left:42px;top:50%;transform:translateY(-50%);white-space:nowrap;background:#16282B;color:#F3F0E8;font:500 13px 'Schibsted Grotesk',Arial,sans-serif;padding:6px 10px;border-radius:2px}
.pin.on .tag{display:block}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;z-index:1}
.lbl.town{font:500 12px 'Schibsted Grotesk',Arial,sans-serif;color:#2B3E41;text-shadow:0 0 3px #F3F0E8,0 0 3px #F3F0E8}
.lbl.water{font:italic 400 16px 'Newsreader',Georgia,serif;color:#2F5A60;letter-spacing:.02em}
.lbl.area{font:italic 400 14px 'Newsreader',Georgia,serif;color:#5B6A6B}
.lbl.air{font:600 11px 'Schibsted Grotesk',Arial,sans-serif;color:#16282B;background:#F3F0E8;border:1px solid #16282B;padding:1px 4px}
.seg{fill:none;stroke:#16282B;stroke-opacity:.45;stroke-linecap:round}
.seg.on{stroke:#A3471F;stroke-opacity:1}
.stamp{box-sizing:border-box;padding:7px;background:#FBF9F4;-webkit-mask:radial-gradient(circle,#0000 3.1px,#000 3.6px) -5px -5px/10px 10px,linear-gradient(#000 0 0) content-box;mask:radial-gradient(circle,#0000 3.1px,#000 3.6px) -5px -5px/10px 10px,linear-gradient(#000 0 0) content-box}
.stamp img{display:block;width:100%;height:100%;object-fit:cover}
.seg-btn{height:36px;padding:0 14px;border:0;background:transparent;color:#16282B;font:500 14px 'Schibsted Grotesk',Arial,sans-serif;cursor:pointer;border-radius:2px}
.seg-btn.on{background:#16282B;color:#F3F0E8}
.ibtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(22,40,43,.25);background:transparent;color:#16282B;border-radius:2px;cursor:pointer;padding:0;text-decoration:none}
.ibtn:hover{border-color:#16282B;color:#16282B}
.mini{width:50px;height:50px;padding:0;border:0;background:transparent;cursor:pointer;position:relative}
.mini .stamp{width:50px;height:50px;padding:4px}
.mini span{position:absolute;left:-4px;top:-6px;width:18px;height:18px;border-radius:50%;background:#16282B;color:#F3F0E8;font:600 10px/18px 'Schibsted Grotesk',Arial,sans-serif;text-align:center}
.dotnav{width:6px;height:6px;border-radius:50%;background:rgba(22,40,43,.25)}
.dotnav.on{background:#A3471F;width:18px;border-radius:3px}
.row{width:100%;display:grid;grid-template-columns:60px minmax(0,1fr) 20px;gap:14px;align-items:center;padding:12px 0;border:0;border-top:1px solid rgba(22,40,43,.16);background:transparent;text-align:left;cursor:pointer;color:#16282B}
.row .stamp{width:60px;height:60px;padding:4px}
</style>

    const step = (now) => {

      const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
